name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  confirm:
    name: Confirm Destroy
    runs-on: ubuntu-latest

    steps:
      # Expression comparisons are case-insensitive, so the exact match is checked in the shell.
      - name: Require exact DESTROY confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DESTROY" ]; then
            echo "::error::Confirmation must be exactly DESTROY. Nothing was destroyed."
            exit 1
          fi

  destroy:
    name: Terraform Destroy
    needs: confirm
    runs-on: ubuntu-latest

    environment:
      name: destroy

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::445567089145:role/ec2-to-ecs-migration-dev-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-destroy-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve -var="image_tag=${{ github.sha }}"
