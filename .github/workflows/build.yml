name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  build:
    name: Build and scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build container image
        run: |
          docker build \
            --tag ec2-to-ecs-migration:${{ github.sha }} \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ec2-to-ecs-migration:${{ github.sha }}
          syft-version: "v1.55.0"
          format: cyclonedx-json
          output-file: sbom.json

      - name: Scan container image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ec2-to-ecs-migration:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: grype-results.sarif
          by-cve: true

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: grype-results.sarif

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::445567089145:role/ec2-ecs-migration-dev-github-actions
          role-session-name: github-actions-${{ github.run_id }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: 445567089145.dkr.ecr.eu-west-2.amazonaws.com
          ECR_REPOSITORY: ec2-ecs-migration-dev
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            ec2-to-ecs-migration:${IMAGE_TAG} \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}